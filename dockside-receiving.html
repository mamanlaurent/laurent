async function exportShipmentPrintable(sh){
  var built=buildShipmentRows(sh), f=built.fields;
  var body=built.rows.slice(built.hdrIndex);
  var head=body.shift()||[];
  var N=Math.max(head.length, 6);

  /* ONE rectangular grid, no nested tables. Excel flattens nested tables into a mess, so
     every row here has exactly N cells and the letterhead sits in the same columns as the
     CSV (B = company and Ship To/Bill To labels, C = addresses, D = right-hand labels,
     E = their values). That is what makes it open in Excel looking like the invoice. */
  function row(cells, extra){
    var out=new Array(N);
    for(var i=0;i<N;i++) out[i]=null;
    cells.forEach(function(c){ if(c[0]<N) out[c[0]]={v:c[1], cls:c[2]||''}; });
    return '<tr'+(extra||'')+'>'+out.map(function(c){
      if(!c) return '<td></td>';
      return '<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+c.v+'</td>';
    }).join('')+'</tr>';
  }
  var ship=f.shipTo.length? f.shipTo : [f.client];
  var bill=f.billTo.length? f.billTo : [f.client];
  var H=[];
  H.push(row([[1,esc(f.company),'logo'], [4,'Invoice','title']]));
  H.push(row([[1,esc(f.companySub||''),'logosub']]));
  f.companyAddr.forEach(function(l){ H.push(row([[1,esc(l),'small']])); });
  H.push(row([]));
  H.push(row([[1,'Ship To:','shiplbl'], [3,'No:','lbl'], [4,esc(f.no),'val']]));
  H.push(row([[2,esc(ship[0]||'')], [3,'CONTAINER:','lbl'], [4,esc(f.container),'val']]));
  H.push(row([[2,esc(ship[1]||'')], [3,'Date:','lbl'], [4,esc(f.date),'val']]));
  H.push(row([[2,esc(ship[2]||'')], [3,'Customer ID:','lbl'], [4,esc(f.custId),'val']]));
  H.push(row([[1,'Bill To:','shiplbl'], [3,'PERMIT #:','permit'], [4,esc(f.permit),'val']]));
  H.push(row([[2,esc(bill[0]||'')]].concat(f.po? [[3,'P.O. NUMBER','lbl'],[4,esc(f.po),'val']] : [])));
  H.push(row([[2,esc(bill[1]||'')]]));
  H.push(row([[2,esc(bill[2]||'')]]));
  H.push(row([]));

  var cols='';
  var W={0:80, 1:180, 2:270, 3:120, 4:170};
  for(var ci=0; ci<N; ci++) cols+='<col style="width:'+(W[ci]||85)+'px;">';

  var grid = '<tr>'+head.map(function(h,i){
      return i<N? '<td class="hdr">'+esc(String(h==null?'':h))+'</td>' : '';
    }).join('')+(function(){ var pad=''; for(var i=head.length;i<N;i++) pad+='<td class="hdr"></td>'; return pad; })()+'</tr>';
  var bodyRows = body.map(function(r){
    if(!r.length) return row([]);
    var cells=[];
    for(var i=0;i<Math.min(r.length,N);i++){
      var v=String(r[i]==null?'':r[i]);
      var cls='cell';
      if(/^\d{8,}(\s+\d{8,})*$/.test(v)) cls='cell txt';          // barcodes stay text
      else if(v!=='' && /^-?[\d.]+$/.test(v)) cls='cell num';
      cells.push([i, esc(v), cls]);
    }
    return row(cells);
  }).join('');

  var sheetName=(sh.getAttribute('data-container')||sh.getAttribute('data-invno')||'Invoice')
    .replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31) || 'Invoice';

  var html=''+
  '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+
  '<meta name="ProgId" content="Excel.Sheet"><meta name="Generator" content="Dockside Receiving">'+
  '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'+
  '<x:Name>'+esc(sheetName)+'</x:Name><x:WorksheetOptions>'+
  '<x:PageSetup><x:Layout x:Orientation="Landscape"/><x:PageMargins x:Bottom="0.5" x:Left="0.4" x:Right="0.4" x:Top="0.5"/></x:PageSetup>'+
  '<x:FitToPage/><x:Print><x:FitWidth>1</x:FitWidth><x:FitHeight>0</x:FitHeight><x:ValidPrinterInfo/></x:Print>'+
  '<x:Selected/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'+
  '<title>'+esc(built.name)+'</title><style>'+
  'body{font-family:Arial,Helvetica,sans-serif;font-size:10pt;color:#000;}'+
  'table{border-collapse:collapse;}'+
  'td,th{padding:2px 5px;vertical-align:bottom;}'+
  'br{mso-data-placement:same-cell;}'+
  '.txt{mso-number-format:"\\@";}'+
  '.logo{font-family:"Times New Roman",Georgia,serif;font-size:20pt;letter-spacing:5px;'+
    'border:2px solid #000;text-align:center;white-space:nowrap;height:44px;}'+
  '.logosub{font-family:"Times New Roman",Georgia,serif;font-size:8pt;letter-spacing:3px;text-align:center;}'+
  '.title{font-size:26pt;white-space:nowrap;}'+
  '.lbl{font-weight:bold;text-align:right;white-space:nowrap;}'+
  '.permit{font-weight:bold;text-align:right;color:#c00000;white-space:nowrap;}'+
  '.val{border-bottom:1px solid #000;white-space:nowrap;}'+
  '.shiplbl{font-weight:bold;text-decoration:underline;}'+
  '.small{font-size:8pt;}'+
  '.hdr{border:1px solid #000;background:#d9d9d9;font-weight:bold;text-align:left;font-size:9pt;}'+
  '.cell{border:1px solid #000;font-size:9pt;vertical-align:top;}'+
  '.num{text-align:right;}'+
  '</style></head><body>'+
  '<table><tbody>'+cols+H.join('')+grid+bodyRows+'</tbody></table>'+
  '</body></html>';

  var downloadsApi=null;
  try{ downloadsApi = await claude.use('downloads'); }catch(e){ downloadsApi=null; }
  if(!downloadsApi){ toast('Downloads are not available in this view.','bad'); return; }
  try{
    await downloadsApi.save({filename:built.name+'.html', data:html});
    toast('Saved '+built.name+'.html — right-click it and choose Open with → Excel. Press ? for the steps.');
  }catch(err){
    var code=err&&err.code;
    if(code==='declined'){ /* cancelled */ }
    else if(code==='extension_not_enabled'){ toast('This view cannot save that file type — use Excel (CSV) instead.','bad'); }
    else toast('Could not save file: '+((err&&err.message)||code||'unknown error'),'bad');
  }
}

        (owner?'':'<button class="btn-ghost btn-sm" data-toggle-role="'+esc(e.getAttribute('data-rid'))+'">Make '+(e.getAttribute('data-role')==='admin'?'employee':'admin')+'</button>'+

        '<button class="btn-ghost btn-sm" data-del-emp="'+esc(e.getAttribute('data-rid'))+'" title="Delete user">🗑</button>')+
      '</td>'+
    '</tr>';
  }).join('');
  return '' +
  '<h1 class="section-title">Users &amp; Security</h1><p class="section-sub">Individual employee logins with Administrator / Warehouse Employee permissions.</p>'+
  '<div class="card pad" style="margin-bottom:18px;">'+
    '<h3 style="margin:0 0 10px;">Team PIN</h3>'+
    '<p class="small muted" style="margin:0 0 10px;">Everyone uses this PIN plus their own name to log in and attribute scans. This is a convenience gate, not real security — treat this page like a shared internal tool.</p>'+
    '<div class="row"><input id="teamPinInput" style="max-width:140px;" value="'+esc(settingsEl.getAttribute('data-teampin'))+'"><button class="btn btn-sm" id="btnSaveTeamPin">Update PIN</button></div>'+
  '</div>'+
  '<div class="card pad" style="margin-bottom:18px;">'+
    '<h3 style="margin:0 0 8px;">Invoice letterhead</h3>'+
    '<p class="small muted" style="margin:0 0 12px;">Your own company details — these print at the top of every shipment export. '+
      'The client\'s Ship To / Bill To address, Customer ID and Permit # live on the client record.</p>'+
    '<div class="grid grid-2" style="gap:12px;">'+
      '<div class="field"><label>Company name</label><input id="setCompany" value="'+esc(settingVal('data-company'))+'" placeholder="NEEDMAJ"></div>'+
      '<div class="field"><label>Second line</label><input id="setCompanySub" value="'+esc(settingVal('data-companysub'))+'" placeholder="DISTRIBUTORS, LLC"></div>'+
    '</div>'+
    '<div class="field" style="margin-top:10px;"><label>Company address (optional)</label><textarea id="setCompanyAddr" rows="2">'+esc(settingVal('data-companyaddr'))+'</textarea></div>'+
    '<div class="row wrap" style="gap:10px;margin-top:10px;align-items:flex-end;">'+
      '<div class="field" style="max-width:220px;"><label>Default permit #</label><input id="setCompanyPermit" value="'+esc(settingVal('data-companypermit'))+'" placeholder="Used when the client has none"></div>'+
      '<button class="btn btn-sm" id="btnSaveLetterhead">Save letterhead</button>'+
    '</div>'+
  '</div>'+
  '<div class="card pad" style="margin-bottom:18px;">'+
    '<h3 style="margin:0 0 8px;">Saving &amp; backup</h3>'+
    '<p class="small muted" style="margin:0 0 10px;">Everything you do is saved on <strong>this device</strong> the moment you do it, and survives closing the browser. '+
      '<strong>Save to cloud</strong> stores a copy on the artifact itself so another device sees it next time it opens the link — it reloads the page, so do it between containers rather than mid-scan. '+
      'A <strong>backup file</strong> is the dependable way to move everything to another device or keep a copy off the system.</p>'+
    (usingLocalCopy?
      '<div class="small" style="background:var(--warn-bg);color:var(--warn);padding:11px 13px;border-radius:7px;margin:0 0 12px;font-weight:600;">'+
        'This device is showing <strong>its own copy</strong>, last changed '+esc(fmtDateTime(localSavedAt))+'. '+
        'The cloud copy is from '+esc(cloudSavedAt? fmtDateTime(cloudSavedAt):'—')+'. '+

      '</div>' : '')+
    '<div class="row wrap" style="gap:8px;">'+
      '<button class="btn btn-sm" id="btnCloudSave2">☁ Save to cloud now</button>'+
      (usingLocalCopy? '<button class="btn btn-sm" id="btnUseCloud">⇩ Use the cloud copy instead</button>' : '')+
      '<button class="btn btn-sm" id="btnExportBackup">⇩ Export backup file</button>'+
      '<label class="btn btn-sm">⇪ Restore from backup<input type="file" id="restoreFile" accept=".json,application/json" class="hidden"></label>'+
    '</div>'+
    '<div class="row" style="margin-top:10px;gap:14px;"><span class="savestatus small ss-ok"></span><span class="cloudstatus small ss-ok"></span></div>'+
  '</div>'+

  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

/* Employees are edited, not just added and deleted — a name typed wrong on day one used to
   be permanent, and the only way to change a role was the toggle button. The owner account
   keeps its role and its owner flag; everything else is editable. */
function openEmployeeModal(rec){
  var isEdit=!!rec, owner=isEdit && rec.getAttribute('data-owner')==='true';
  document.body.insertAdjacentHTML('beforeend','' +
    '<div class="modal-back" id="empModalBack"><div class="modal" style="max-width:420px;">'+
    '<div class="modal-head"><h3 style="margin:0;flex:1;">'+(isEdit?'Edit employee':'Add employee')+'</h3><button class="btn-ghost" id="closeEmpModal">✕</button></div>'+
    '<div class="modal-body col" style="gap:12px;">'+
      '<div class="field"><label>Name <span style="color:var(--bad);">*</span></label><input id="empName" value="'+(isEdit?esc(rec.getAttribute('data-name')):'')+'"></div>'+
      '<div class="field"><label>Role</label><select id="empRole"'+(owner?' disabled':'')+'>'+
        '<option value="employee"'+(isEdit&&rec.getAttribute('data-role')!=='admin'?' selected':'')+'>Warehouse Employee</option>'+
        '<option value="admin"'+(isEdit&&rec.getAttribute('data-role')==='admin'?' selected':'')+'>Administrator</option>'+
      '</select>'+(owner?'<div class="small muted" style="margin-top:5px;">The owner account is always an administrator.</div>':'')+'</div>'+
      (isEdit&&!owner? '<label class="row small chk" style="gap:7px;cursor:pointer;"><input type="checkbox" id="empActive" '+(rec.getAttribute('data-active')!=='false'?'checked':'')+' style="width:auto;"> Active (uncheck to hide from the login list)</label>' : '')+
      (isEdit? '<div class="small muted">Past scans stay in the audit trail under the old name — the record of who did what is never rewritten.</div>':'')+
    '</div>'+
    '<div class="modal-foot"><button class="btn" id="cancelEmpModal">Cancel</button><button class="btn btn-primary" id="saveEmpModal">'+(isEdit?'Save':'Add')+'</button></div>'+
    '</div></div>');
  $('#closeEmpModal').onclick=$('#cancelEmpModal').onclick=function(){ closeModal('empModalBack'); };
  setTimeout(function(){ try{ $('#empName').focus(); }catch(e){} }, 60);
  $('#saveEmpModal').addEventListener('click', function(){
    var name=$('#empName').value.trim(); if(!name){ toast('Name required.','bad'); return; }
    var clash=activeRoster().find(function(e){
      return e!==rec && e.getAttribute('data-name').toLowerCase()===name.toLowerCase();
    });
    if(clash){ toast('Someone with that name is already on the list.','bad'); return; }
    var role=owner? 'admin' : $('#empRole').value;
    if(isEdit){
      var was=rec.getAttribute('data-name');
      rec.setAttribute('data-name', name);
      rec.setAttribute('data-role', role);
      var act=$('#empActive'); if(act) rec.setAttribute('data-active', act.checked?'true':'false');
      if(currentUser && currentUser.id===rec.getAttribute('data-rid')){
        currentUser.name=name; currentUser.role=role;
        try{ sessionStorage.setItem('dr_user', JSON.stringify(currentUser)); }catch(e){}
      }
      appendAuditRaw('edit-user', currentUser.name+' updated '+(was===name? name : was+' → '+name)+' ('+role+')');
    } else {
      var el=document.createElement('div'); el.className='employee';
      el.setAttribute('data-rid',uid()); el.setAttribute('data-name',name); el.setAttribute('data-role',role);
      el.setAttribute('data-active','true'); el.setAttribute('data-owner','false');
      rosterEl.appendChild(el);
      appendAuditRaw('add-user', currentUser.name+' added employee '+name+' ('+role+')');
    }
    closeModal('empModalBack'); render();
  });
}
function wireUsersView(){
  var cs2=$('#btnCloudSave2'); if(cs2) cs2.addEventListener('click', function(){ saveToCloud(); });
  var lh=$('#btnSaveLetterhead');
  if(lh) lh.addEventListener('click', function(){
    [['data-company','#setCompany'],['data-companysub','#setCompanySub'],
     ['data-companyaddr','#setCompanyAddr'],['data-companypermit','#setCompanyPermit']].forEach(function(pr){
      var f=$(pr[1]); if(f) settingsEl.setAttribute(pr[0], f.value.trim());
    });
    appendAuditRaw('edit-letterhead', currentUser.name+' updated the invoice letterhead');
    toast('Letterhead saved — it appears on every export.');
  });
  var uc=$('#btnUseCloud'); if(uc) uc.addEventListener('click', useCloudCopy);
  var eb=$('#btnExportBackup'); if(eb) eb.addEventListener('click', exportBackup);
  var rf=$('#restoreFile'); if(rf) rf.addEventListener('change', function(ev){ importBackup(ev.target.files[0]); ev.target.value=''; });
  paintSaveStatus(); paintCloudStatus();
  $('#btnSaveTeamPin').addEventListener('click', function(){
    var v=$('#teamPinInput').value.trim(); if(!v){ toast('PIN cannot be empty.','bad'); return; }
    settingsEl.setAttribute('data-teampin', v);
    settingsEl.setAttribute('data-seeded', 'false');
    appendAuditRaw('security', currentUser.name+' updated the team PIN');
    toast('Team PIN updated.');
  });
  $('#btnAddEmp').addEventListener('click', function(){ openEmployeeModal(null); });
  $$('[data-edit-emp]').forEach(function(b){
    b.addEventListener('click', function(){ openEmployeeModal(findEmployee(b.getAttribute('data-edit-emp'))); });
  });
  $$('[data-toggle-role]').forEach(function(b){ b.addEventListener('click', function(){
    var e=findEmployee(b.getAttribute('data-toggle-role'));
    var newRole = e.getAttribute('data-role')==='admin'?'employee':'admin';
    e.setAttribute('data-role', newRole);
    appendAuditRaw('role-change', currentUser.name+' set '+e.getAttribute('data-name')+' to '+newRole);
    render();
  }); });
  $$('[data-del-emp]').forEach(function(b){ b.addEventListener('click', function(){ deleteEmployee(b.getAttribute('data-del-emp')); }); });
  $$('[data-toggle-emp]').forEach(function(b){ b.addEventListener('click', function(){
    var e=findEmployee(b.getAttribute('data-toggle-emp'));
    var nowActive = e.getAttribute('data-active')==='false';
    e.setAttribute('data-active', nowActive?'true':'false');
    appendAuditRaw('user-status', currentUser.name+' '+(nowActive?'reactivated':'deactivated')+' '+e.getAttribute('data-name'));
    render();
  }); });
}

/* ================================================================ viewport wiring dispatcher */
function wireViewport(){
  if(view.tab==='shipments' && view.shipmentId){
    var sh=findShipment(view.shipmentId);
    if(sh) wireShipmentDetail(sh);
  } else if(view.tab==='shipments'){ wireShipmentsList(); }
  else if(view.tab==='clients'){ wireClientsView(); }
  else if(view.tab==='skus'){ wireSkuMasterView(); }
  else if(view.tab==='pricelist'){ wirePriceListView(); }
  else if(view.tab==='reports'){
    wireReportsView();
    // export button lives in shipment detail; report row click routes to shipments tab detail which has its own export
  }
  else if(view.tab==='users' && isAdmin()){ wireUsersView(); }
}

/* ================================================================ sync lifecycle */
function wireSyncEvents(){
  if(window.__drSyncWired) return; window.__drSyncWired=true;
  // save whatever is pending if the tab is closed or backgrounded mid-scan
  window.addEventListener('beforeunload', function(){ clearTimeout(saveTimer); saveLocal(); });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden'){ clearTimeout(saveTimer); saveLocal(); }
  });
}

/* ================================================================ boot */
async function boot(){
  bindDbRefs();
  loadLocalIfNewer();      // this device's copy wins if it is newer than what was served
  wireSyncEvents();
  try{ artifactApi = await claude.use('artifact'); }catch(e){ artifactApi=null; }
  render();
}
boot();

})();
</script>
