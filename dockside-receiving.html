function closeModal(id){ var m=document.getElementById(id); if(m) m.remove(); }
function wireNewShipmentModal(){
  $('#closeNewShip').addEventListener('click', function(){ closeModal('newShipModalBack'); });
  $('#cancelNewShip').addEventListener('click', function(){ closeModal('newShipModalBack'); });
  $('#newShipModalBack').addEventListener('click', function(ev){ if(ev.target.id==='newShipModalBack') closeModal('newShipModalBack'); });
  $('#nsFile').addEventListener('change', async function(ev){
    var file=ev.target.files[0]; if(!file){ return; }
    $('#nsMapper').innerHTML='<div class="small muted" style="margin-top:8px;">Reading '+esc(file.name)+'…</div>';
    $('#nsPreview').innerHTML='';
    pendingImportLines=null;
    try{
      var rows=await parseTabularFile(file);
      importState.rows=rows;
      importState.headerIdx=detectHeaderRow(rows);
      autoMapImportColumns();
      var sniffed=sniffHeaderFields(rows, importState.headerIdx);
      if(sniffed.po && !$('#nsPO').value) $('#nsPO').value=sniffed.po;
      if(sniffed.invno && $('#nsInvNo') && !$('#nsInvNo').value) $('#nsInvNo').value=sniffed.invno;
      if(sniffed.custid && $('#nsCustId') && !$('#nsCustId').value) $('#nsCustId').value=sniffed.custid;
      // Customer ID and Permit # live on the client — carry them across on first sight
      importState.sniffedClient={custid:sniffed.custid, permit:sniffed.permit};
      if(sniffed.container && !$('#nsContainer').value) $('#nsContainer').value=sniffed.container;
      if(sniffed.supplier && !$('#nsSupplier').value) $('#nsSupplier').value=sniffed.supplier;
      // the date box is pre-filled with today, so "empty" never happens — only let the slip
      // win when the operator has not deliberately typed a different date
      if(sniffed.date && $('#nsDate').value===todayStr()) $('#nsDate').value=sniffed.date;
      renderImportMapper();
    }catch(e){ toast(e.message||'Could not parse that file.','bad'); $('#nsMapper').innerHTML=''; }
  });
  var nsCl=$('#nsClient');
  if(nsCl) nsCl.addEventListener('change', function(){
    var f=$('#nsCustId'); if(!f || f.value.trim()) return;
    var known=clientField(this.value.trim(),'data-custid');
    if(known) f.value=known;
  });
  $('#saveNewShip').addEventListener('click', async function(){
    var client=$('#nsClient').value.trim();
    if(!client){ toast('Client is required.','bad'); return; }
    if(importState.qtyLooksWrong){
      toast('Those quantities are not right — fix the Quantity column before creating the shipment.','bad');
      return;
    }
    var id=uid();
    var attrs = {
      'data-rid':id, 'data-client':client, 'data-container':$('#nsContainer').value.trim(),
      'data-po':$('#nsPO').value.trim(), 'data-date':$('#nsDate').value||todayStr(),
      'data-invno':($('#nsInvNo')&&$('#nsInvNo').value.trim())||'',
      'data-supplier':$('#nsSupplier').value.trim(), 'data-notes':$('#nsNotes').value.trim(),
      'data-status':'Open', 'data-pallets':'0', 'data-palletnotes':'',
      'data-createdby':currentUser.name, 'data-createdat':new Date().toISOString(),
      'data-completedby':'', 'data-completedat':'', 'data-confirmeddiscrepancy':'false'
    };
    var btn=$('#saveNewShip'); btn.disabled=true; btn.textContent='Creating…';
    function build(){
      var sh=document.createElement('div'); sh.className='shipment';
      Object.keys(attrs).forEach(function(k){ sh.setAttribute(k, attrs[k]); });
      var lines=document.createElement('div'); lines.className='lines';
      var scanlog=document.createElement('div'); scanlog.className='scanlog';
      sh.appendChild(lines); sh.appendChild(scanlog);
      shipmentsEl.appendChild(sh);
      var clRec=ensureClient(client); // register the client so it gets a history page
      var sn=importState.sniffedClient||{};
      var typedCust=($('#nsCustId') && $('#nsCustId').value.trim())||'';
      if(typedCust) clRec.setAttribute('data-custid', typedCust);
      if(sn.custid && !(clRec.getAttribute('data-custid')||'').trim()) clRec.setAttribute('data-custid', sn.custid);
      if(sn.permit && !(clRec.getAttribute('data-permit')||'').trim()) clRec.setAttribute('data-permit', sn.permit);
      appendAuditRaw('create-shipment', currentUser.name+' created shipment for '+client+(attrs['data-container']?' / container '+attrs['data-container']:''));
    }
    try{
      await withSync(build); // creating one shipment shell is a single direct gesture-driven write
      var sh = findShipment(id);
      if(pendingImportLines && pendingImportLines.length){
        var linesEl = $('.lines', sh);
        await bulkWrite(pendingImportLines, 40, function(l){
          // every packing-slip line also lands in the master catalogue, so the product list
          // builds itself over time — barcodes get attached later, on the first scan
          ensureMasterSku(l.desc, l.sku, l.barcode? [l.barcode] : []);
          var line=document.createElement('div'); line.className='line';
          line.setAttribute('data-sku', l.sku); line.setAttribute('data-desc', l.desc); line.setAttribute('data-expected', String(l.expected));
          // keep the slip's own row so the export can reproduce its exact columns
          if(l.units) line.setAttribute('data-units', String(l.units));
          if(l.net) line.setAttribute('data-net', String(l.net));
          if(l.gross) line.setAttribute('data-gross', String(l.gross));
          if(l.raw && l.raw.length) line.setAttribute('data-raw', JSON.stringify(l.raw));
          linesEl.appendChild(line);
        });
        // remember the slip's own headings + letterhead block for the export
        if(importState.rows){
          var keepCols=keptColumnIdx(importState.rows, importState.headerIdx);
          var hdrRow=pickCells(importState.rows[importState.headerIdx], keepCols);
          sh.setAttribute('data-srcheaders', JSON.stringify(hdrRow));
          var meta=[];
          for(var mr=0; mr<importState.headerIdx; mr++){
            var rw=pickCells(importState.rows[mr], keepCols);
            if(rw.some(function(c){return c.trim();})) meta.push(rw);
          }
          sh.setAttribute('data-slipmeta', JSON.stringify(meta));
        }
        // the slip already works out pallets and loose boxes — carry them across
        if(importState.rows && importState.palletCount>=0){
          var palTot=0, extraTot=0;
          for(var pr=importState.headerIdx+1; pr<importState.rows.length; pr++){
            if(!isLineRow(importState.rows, pr, importState.desc)) continue;   // skip the slip's own total row
            palTot+=parseQtyCell((importState.rows[pr]||[])[importState.palletCount]);
            if(importState.extraBoxes>=0) extraTot+=parseQtyCell((importState.rows[pr]||[])[importState.extraBoxes]);
          }
          if(palTot>0){
            sh.setAttribute('data-pallets', String(Math.ceil(palTot)));
            sh.setAttribute('data-palletnotes',
              'From packing slip: '+palTot.toFixed(2)+' full pallets'+
              (extraTot>0? ', '+extraTot+' loose boxes for a mixed pallet':''));
          }
        }
        appendAuditRaw('import-slip', currentUser.name+' imported '+pendingImportLines.length+' packing-slip line(s)');
      }
      pendingImportLines=null;
      importState={rows:null, headerIdx:0, desc:-1, qty:-1, sku:-1, barcode:-1,
                   unitsPerPallet:-1, palletCount:-1, extraBoxes:-1, knownFormat:''};
      closeModal('newShipModalBack');
      toast('Shipment created.');
      goto('shipments', id);
    }catch(err){ btn.disabled=false; btn.textContent='Create Shipment'; }
  });
}

/* ================================================================ SHIPMENT DETAIL / RECEIVING */
var scanFlash=null; // {kind,msg} transient, per-device only

/* Barcodes waiting to be identified on THIS device. Not shared: the box is physically in this
   scanner's hands. One prompt at a time; further unknown scans queue behind it. */
var pendingEnroll=[];
var enrollFilter='';

/* has this item ever had a barcode linked? */
function itemHasBarcode(sku){
  var rec=findSkuByCode(sku);
  return !!(rec && skuBarcodes(rec).length);
}

function renderEnrollPanel(sh){
  if(!pendingEnroll.length) return '';
  var code=pendingEnroll[0];
  var q=normDesc(enrollFilter);
  var lines=shipmentLines(sh).slice();
  // items still missing a barcode come first — that's almost always what you just scanned
  lines.sort(function(a,b){
    var an=itemHasBarcode(a.getAttribute('data-sku'))?1:0, bn=itemHasBarcode(b.getAttribute('data-sku'))?1:0;
    if(an!==bn) return an-bn;
    return (a.getAttribute('data-desc')||'').localeCompare(b.getAttribute('data-desc')||'');
  });
  var shown=lines.filter(function(l){
    if(!q) return true;
    return normDesc(l.getAttribute('data-desc')+' '+l.getAttribute('data-sku')).indexOf(q)>-1;
  });
  var rows=shown.map(function(l){
    var sku=l.getAttribute('data-sku');
    var exp=parseInt(l.getAttribute('data-expected')||'0',10);
    var got=countScans(sh,sku);
    var has=itemHasBarcode(sku);
    return '<button class="enroll-opt" data-enroll-sku="'+esc(sku)+'">'+
        '<div style="min-width:0;flex:1;">'+
          '<div class="enroll-desc">'+esc(skuLabel(findSkuByCode(sku)) || l.getAttribute('data-desc') || sku)+'</div>'+
          '<div class="enroll-meta">'+got+' of '+exp+' scanned'+(has?' · barcode already linked':'')+'</div>'+
        '</div>'+
        (has?'<span class="enroll-tag" style="background:#2a313b;color:#aeb7c2;">has barcode</span>':'<span class="enroll-tag" style="background:#3a2b0a;color:#f0c565;">needs barcode</span>')+
      '</button>';
  }).join('');
  return ''+
  '<div id="enrollPanel" class="enroll-panel">'+
    '<div class="row wrap" style="gap:8px;margin-bottom:4px;">'+
      '<div style="font-weight:800;font-size:14px;color:#f0c565;">New barcode — which item is this?</div>'+
      '<div class="spacer"></div>'+
      (pendingEnroll.length>1?'<span class="small" style="color:#aeb7c2;">'+(pendingEnroll.length-1)+' more waiting</span>':'')+
    '</div>'+
    '<div class="mono" style="font-size:17px;color:#fff;margin-bottom:8px;">'+esc(code)+'</div>'+
    '<div class="small" style="color:#aeb7c2;margin-bottom:8px;">Pick the item on the packing slip. This barcode is then saved to your Master SKU list and recognized instantly from now on — on this container and every future one.</div>'+
    '<input id="enrollFilter" class="enroll-filter" placeholder="Type to narrow the list…" autocomplete="off" value="'+esc(enrollFilter)+'">'+
    '<div class="enroll-list">'+(rows||'<div class="small" style="color:#aeb7c2;padding:10px;">No packing-slip items match that text.</div>')+'</div>'+
    '<div class="row" style="margin-top:10px;gap:8px;">'+
      '<button class="btn btn-sm" id="btnEnrollNew" style="background:#0f2a1c;border-color:#2c6b48;color:#7be3ab;">+ Add as a new product</button>'+
      '<button class="btn btn-sm" id="btnEnrollReject" style="background:#3a1512;border-color:#7d3a30;color:#f3958a;">Not on this packing slip</button>'+
      '<button class="btn btn-sm" id="btnEnrollSkip" style="background:#232a34;border-color:#39424f;color:#dfe3e8;">Skip for now</button>'+
    '</div>'+
  '</div>';
}

function renderShipmentDetail(sh){
  var id=sh.getAttribute('data-rid');
  var status=sh.getAttribute('data-status');
  var tot=shipmentTotals(sh);
  var lines=shipmentLines(sh).slice().sort(function(a,b){ return a.getAttribute('data-sku').localeCompare(b.getAttribute('data-sku')); });
  var scans=shipmentScans(sh).slice().sort(function(a,b){ return b.getAttribute('data-ts').localeCompare(a.getAttribute('data-ts')); });
  var extras=tot.extras;

  var headerRow = '' +
  '<div class="d-navrow row wrap" style="margin-bottom:14px;align-items:center;">'+
    '<button class="btn-ghost" id="backToList">← All shipments</button>'+
    '<div class="spacer"></div>'+
    '<span class="pill pill-'+status.toLowerCase()+'">'+status+'</span>'+
    '<button class="btn btn-primary btn-sm" id="btnExportPrintable" title="The formatted invoice — letterhead, Ship To / Bill To, right-hand details. Editable in Excel.">📗 Excel invoice sheet</button>'+
    '<button class="btn-ghost btn-sm" id="btnExcelHelp" title="How to open it in Excel">?</button>'+
    '<button class="btn btn-sm" id="btnExportShipment" title="Raw data only — a CSV file cannot carry the letterhead formatting">⇩ Plain CSV</button>'+
    (isAdmin()?'<button class="btn btn-sm btn-danger" id="btnDeleteShipment">🗑 Delete</button>':'')+
  '</div>';

  var infoCard = '' +
  '<div class="d-info card pad" style="margin-bottom:18px;">'+
    '<div class="row wrap" style="justify-content:space-between;align-items:flex-start;">'+
      '<div><h1 class="section-title" style="margin-bottom:4px;">'+esc(sh.getAttribute('data-client')||'Untitled shipment')+'</h1>'+
      '<div class="muted small">Container <span class="mono">'+esc(sh.getAttribute('data-container')||'—')+'</span> · PO/Slip <span class="mono">'+esc(sh.getAttribute('data-po')||'—')+'</span> · '+fmtDate(sh.getAttribute('data-date'))+(sh.getAttribute('data-supplier')?' · Supplier: '+esc(sh.getAttribute('data-supplier')):'')+'</div></div>'+
      (status!=='Completed'?'<button class="btn btn-sm" id="btnEditHeader">Edit details</button>':'')+
    '</div>'+
    (sh.getAttribute('data-notes')?'<div class="small muted" style="margin-top:8px;">📝 '+esc(sh.getAttribute('data-notes'))+'</div>':'')+
  '</div>';

  var statsRow = '<div class="d-stats grid grid-4" style="margin-bottom:18px;">'+
    '<div class="card stat"><div class="n tab-num">'+tot.expTot+'</div><div class="l">Expected</div></div>'+
    '<div class="card stat"><div class="n tab-num" style="color:var(--accent);">'+tot.scanTot+'</div><div class="l">Scanned</div></div>'+
    '<div class="card stat"><div class="n tab-num">'+Math.max(tot.expTot-tot.scanTot,0)+'</div><div class="l">Remaining</div></div>'+
    '<div class="card stat"><div class="n tab-num" style="color:'+(tot.scanTot-tot.expTot===0?'var(--ok)':(tot.scanTot-tot.expTot>0?'var(--warn)':'var(--bad)'))+';">'+(tot.scanTot-tot.expTot>0?'+':'')+(tot.scanTot-tot.expTot)+'</div><div class="l">Difference</div></div>'+
  '</div>';

  var scanPanel = status==='Completed' ? '' : '' +
  '<div class="d-scan scan-box" style="margin-bottom:18px;">'+
    '<div class="row wrap" style="justify-content:space-between;">'+
      '<div style="font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:#aeb7c2;">Scan boxes as they come off the truck</div>'+
      '<div class="row" style="gap:8px;">'+
        '<button class="btn btn-sm" id="btnToggleCamera" style="background:#232a34;border-color:#39424f;color:#fff;">'+(cameraStream?'📷 Stop camera':'📷 Use phone camera')+'</button>'+
        '<button class="btn btn-sm" id="btnScannerHelp" style="background:#232a34;border-color:#39424f;color:#fff;">Scanner setup</button>'+
      '</div>'+
    '</div>'+
    '<input id="scanInput" class="mono" style="width:100%;margin-top:10px;" placeholder="Scan or type a barcode, then press Enter…" autocomplete="off"'+(keyboardScanMode?' autofocus':'')+'>'+
    '<label class="row small chk" style="gap:7px;margin-top:9px;color:#aeb7c2;cursor:pointer;">'+
      '<input type="checkbox" id="ksmToggle" '+(keyboardScanMode?'checked':'')+' style="width:auto;">'+
      'Keep this box focused for a USB / Bluetooth scanner'+
    '</label>'+
    '<div id="cameraWrap" class="'+(cameraStream?'':'hidden')+'" style="margin-top:12px;">'+
      '<div style="position:relative;">'+
        '<video id="cameraVideo" playsinline muted style="width:100%;max-height:300px;border-radius:8px;background:#000;object-fit:cover;display:block;"></video>'+
        '<div class="aim-guide"><div class="aim-line"></div></div>'+
      '</div>'+
      '<div id="cameraMsg" class="small" style="color:#aeb7c2;margin-top:6px;"></div>'+
    '</div>'+
    '<div id="scanAlert"></div>'+
    renderEnrollPanel(sh)+
    '<div class="small" style="color:#7b8494;margin-top:10px;">Logged in as <strong style="color:#dfe3e8;">'+esc(currentUser.name)+'</strong> · every scan is recorded with your name, time, and result.</div>'+
  '</div>';

  var lineRows = lines.map(function(l){
    var sku=l.getAttribute('data-sku'), exp=parseInt(l.getAttribute('data-expected')||'0',10);
    var got=countScans(sh,sku); var diff=got-exp;
    var diffClass = diff===0?'diff-zero':(diff>0?'diff-pos':'diff-neg');
    var has=itemHasBarcode(sku);
    var editable = status!=='Completed';
    return '<tr>'+
      '<td><div>'+esc(l.getAttribute('data-desc')||sku)+'</div>'+
        '<div class="small mono muted" style="margin-top:2px;">'+esc(sku)+
        (has?'':' · <span style="color:var(--warn);font-weight:700;">no barcode yet</span>')+'</div></td>'+
      '<td>'+(editable
        ? '<input class="tab-num qty-edit" data-exp-sku="'+esc(sku)+'" type="number" min="0" value="'+exp+'">'
        : '<span class="tab-num">'+exp+'</span>')+'</td>'+
      '<td class="tab-num" style="font-weight:700;">'+got+'</td>'+
      '<td class="tab-num">'+Math.max(exp-got,0)+'</td>'+
      '<td class="tab-num '+diffClass+'">'+(diff>0?'+':'')+diff+'</td>'+
      (editable && isAdmin() ? '<td><button class="btn-ghost btn-sm" data-del-line="'+esc(sku)+'" title="Remove this line">🗑</button></td>' : '')+
    '</tr>';
  }).join('');

  var extraRows = Object.keys(extras).map(function(sku){
    var srec=findSkuByCode(sku);
    return '<tr><td><div>'+esc(srec?srec.getAttribute('data-desc'):sku)+'</div><div class="small mono muted" style="margin-top:2px;">'+esc(sku)+'</div></td><td class="tab-num">0</td><td class="tab-num" style="font-weight:700;">'+extras[sku]+'</td><td class="tab-num">0</td><td class="tab-num diff-pos">+'+extras[sku]+'</td>'+
      (status!=='Completed' && isAdmin()
        ? '<td class="row" style="gap:4px;"><button class="btn btn-sm" data-add-line="'+esc(sku)+'">Add to slip</button>'+
          '<button class="btn-ghost btn-sm" data-del-extra="'+esc(sku)+'" title="Delete these scans">🗑</button></td>'
        : '<td></td>')+
    '</tr>';
  }).join('');

  var pendingLearn = lines.filter(function(l){ return !itemHasBarcode(l.getAttribute('data-sku')); }).length;
  var learnNote = (status!=='Completed' && pendingLearn) ?
    '<div class="pad" style="padding-top:0;padding-bottom:12px;"><div class="small" style="background:var(--warn-bg);color:var(--warn);padding:9px 12px;border-radius:7px;font-weight:600;">'+
      pendingLearn+' item'+(pendingLearn===1?'':'s')+' on this slip '+(pendingLearn===1?'has':'have')+' no barcode yet. Scan one box of each and identify it once — after that it\'s recognized instantly, forever.'+
    '</div></div>' : '';

  var linesPanel = '<div class="d-lines card" style="margin-bottom:18px;">'+
    '<div class="pad" style="padding-bottom:0;"><h3 style="margin:0 0 2px;">Expected vs. Scanned</h3><p class="section-sub" style="margin-bottom:12px;">Live across every connected device.</p></div>'+
    learnNote+
    '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Expected</th><th>Scanned</th><th>Remaining</th><th>Diff</th>'+((status!=='Completed'&&isAdmin())||Object.keys(extras).length?'<th></th>':'')+'</tr></thead><tbody>'+
    (lineRows||'<tr><td colspan="5" class="empty">No packing-slip lines yet. Edit shipment details to import a file, or add lines manually.</td></tr>')+
    (Object.keys(extras).length? '<tr><td colspan="6" style="padding-top:14px;padding-bottom:4px;"><strong class="small" style="color:var(--warn);">⚠ Unexpected items scanned (not on packing slip)</strong></td></tr>'+extraRows : '')+
    '</tbody></table></div>'+
    (status!=='Completed'?'<div class="pad" style="padding-top:12px;"><button class="btn btn-sm" id="btnAddLine">+ Add line manually</button></div>':'')+
  '</div>';

  var breakdownPanel = renderBreakdownPanel(sh);

  var palletPanel = '<div class="d-pallet card pad" style="margin-bottom:18px;">'+
    '<h3 style="margin:0 0 12px;">Palletizing</h3>'+
    '<div class="row wrap" style="gap:20px;">'+
      '<div class="field" style="max-width:160px;"><label>Total pallets</label><input id="palletCount" type="number" min="0" class="tab-num" value="'+esc(sh.getAttribute('data-pallets')||'0')+'" '+(status==='Completed'?'disabled':'')+'></div>'+
      '<div class="field" style="flex:1;min-width:220px;"><label>Pallet #s / notes (optional)</label><input id="palletNotes" value="'+esc(sh.getAttribute('data-palletnotes')||'')+'" placeholder="e.g. PLT-01…PLT-14" '+(status==='Completed'?'disabled':'')+'></div>'+
      (status!=='Completed'?'<div style="align-self:flex-end;"><button class="btn btn-sm" id="btnSavePallets">Save</button></div>':'')+
    '</div>'+
  '</div>';

  var scanFeed = '<div class="d-feed card" style="margin-bottom:18px;">'+
    '<div class="pad" style="padding-bottom:10px;"><h3 style="margin:0;">Scan feed</h3><p class="section-sub" style="margin:2px 0 0;">Most recent first'+(isAdmin()?'. Admins can void accidental or duplicate scans.':'.')+'</p></div>'+
    '<div class="table-wrap" style="max-height:320px;overflow-y:auto;"><table><thead><tr><th>Time</th><th>User</th><th>SKU</th><th>Barcode</th><th>Result</th>'+(isAdmin()?'<th></th>':'')+'</tr></thead><tbody>'+
    (scans.length? scans.map(function(s){
      var voided = s.getAttribute('data-void')==='true';
      var res=s.getAttribute('data-result');
      var resLabel={ok:'OK',exceeds:'Exceeds expected',unexpected:'Not on packing slip',unknown:'Unknown barcode'}[res]||res;
      var resColor={ok:'var(--ok)',exceeds:'var(--warn)',unexpected:'var(--warn)',unknown:'var(--bad)'}[res]||'var(--slate)';
      return '<tr style="'+(voided?'opacity:.45;':'')+'">'+
        '<td class="small">'+fmtDateTime(s.getAttribute('data-ts'))+'</td>'+
        '<td class="small">'+esc(s.getAttribute('data-user'))+'</td>'+
        '<td class="mono">'+esc(s.getAttribute('data-sku')||'—')+'</td>'+
        '<td class="mono small">'+esc(s.getAttribute('data-barcode'))+'</td>'+
        '<td class="small" style="color:'+resColor+';font-weight:700;">'+(voided?'VOIDED — ':'')+resLabel+'</td>'+
        (isAdmin()? '<td>'+(voided?'':'<button class="btn-ghost btn-sm" data-void-scan="'+esc(s.getAttribute('data-rid'))+'">Void</button>')+'</td>':'')+
      '</tr>';
    }).join('') : '<tr><td colspan="6" class="empty">No scans yet.</td></tr>')+
    '</tbody></table></div>'+
  '</div>';

  var completePanel = status==='Completed' ? '' +
    '<div class="card pad" style="margin-bottom:18px;background:var(--ok-bg);border-color:var(--ok);">'+
      '<div class="row"><div style="font-size:22px;">✅</div><div><strong>Receiving completed</strong> by '+esc(sh.getAttribute('data-completedby'))+' on '+fmtDateTime(sh.getAttribute('data-completedat'))+'.'+
      (tot.discrepancy?' Discrepancies were present and confirmed at completion.':' Shipment matched the packing slip exactly.')+'</div></div>'+
    '</div>' : ''+
    '<div class="card pad" style="margin-bottom:40px;">'+
      '<h3 style="margin:0 0 10px;">Complete Receiving</h3>'+
      '<button class="btn btn-primary" id="btnComplete">Review &amp; Complete Shipment</button>'+
    '</div>';

  return '<div class="detail-stack">'+
    headerRow+infoCard+statsRow+scanPanel+linesPanel+breakdownPanel+palletPanel+scanFeed+
    '<div class="d-complete">'+completePanel+'</div>'+
  '</div>';
}

function wireShipmentDetail(sh){
  var id=sh.getAttribute('data-rid');
  $('#backToList').addEventListener('click', function(){ stopCamera(); goto('shipments'); });
  $('#btnExportShipment').addEventListener('click', function(){ exportShipmentReport(sh); });
  var pb=$('#btnExportPrintable'); if(pb) pb.addEventListener('click', function(){ exportShipmentPrintable(sh); });
  var xh=$('#btnExcelHelp'); if(xh) xh.addEventListener('click', openExcelHelp);
  var delSh=$('#btnDeleteShipment');
  if(delSh) delSh.addEventListener('click', function(){ deleteShipment(sh.getAttribute('data-rid')); });
  $$('[data-del-line]').forEach(function(b){ b.addEventListener('click', function(){ deleteLine(sh, b.getAttribute('data-del-line')); }); });
  $$('[data-del-extra]').forEach(function(b){ b.addEventListener('click', function(){ deleteExtraScans(sh, b.getAttribute('data-del-extra')); }); });

  var scanInput=$('#scanInput');
  if(scanInput){
    if(keyboardScanMode) scanInput.focus();
    scanInput.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'){
        ev.preventDefault();
        var code=scanInput.value.trim();
        scanInput.value='';
        if(code) submitScan(sh, code, false);
      }
    });
    if(scanRefocusTimer){ clearInterval(scanRefocusTimer); scanRefocusTimer=null; }
    if(keyboardScanMode){
      scanRefocusTimer=setInterval(function(){
        var input=document.getElementById('scanInput');
        if(!input){ clearInterval(scanRefocusTimer); scanRefocusTimer=null; return; }
        var ae=document.activeElement;
        // NEVER steal focus from something the operator is actually using — otherwise
        // typing a pallet count, a note or a filter gets cut off mid-word.
        if(ae && ae!==document.body && ae!==input){
          var tag=(ae.tagName||'').toUpperCase();
          if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||tag==='BUTTON'||tag==='A'||ae.isContentEditable) return;
          if(ae.closest && ae.closest('#enrollPanel')) return;
        }
        if(ae!==input && !document.querySelector('.modal-back') && !cameraStream){ input.focus(); }
      }, 700);
    }
  }
  var ksm=$('#ksmToggle');
  if(ksm) ksm.addEventListener('change', function(){
    setKeyboardScanMode(this.checked);
    if(!keyboardScanMode){ var si=document.getElementById('scanInput'); if(si) si.blur(); }
    rerenderDetail(sh);
    if(keyboardScanMode){ var si2=document.getElementById('scanInput'); if(si2) si2.focus(); }
  });

  var enrollPanel=$('#enrollPanel');
  if(enrollPanel){
    var code=pendingEnroll[0];
    $$('[data-enroll-sku]', enrollPanel).forEach(function(b){
      b.addEventListener('click', function(){ enrollBarcode(sh, code, b.getAttribute('data-enroll-sku')); });
    });
    var ef=$('#enrollFilter', enrollPanel);
    if(ef){
      ef.addEventListener('input', function(){
        enrollFilter=this.value;
        var caret=this.selectionStart;
        rerenderDetail(sh);
        var again=document.getElementById('enrollFilter');
        if(again){ again.focus(); try{ again.setSelectionRange(caret,caret); }catch(e){} }
      });
      // a scanner fires keystrokes then Enter; don't let that submit the filter box
      ef.addEventListener('keydown', function(ev){ if(ev.key==='Enter') ev.preventDefault(); });
    }
    var nw=$('#btnEnrollNew', enrollPanel);
    if(nw) nw.addEventListener('click', function(){ openNewProductFromScan(sh, code); });
    var rj=$('#btnEnrollReject', enrollPanel);
    if(rj) rj.addEventListener('click', function(){ rejectEnroll(sh, code); });
    var sk=$('#btnEnrollSkip', enrollPanel);
    if(sk) sk.addEventListener('click', function(){ skipEnroll(sh); });
  }

  var help=$('#btnScannerHelp');
  if(help) help.addEventListener('click', openScannerHelp);
  var camBtn=$('#btnToggleCamera');
  if(camBtn) camBtn.addEventListener('click', function(){ cameraStream? stopCamera():startCamera(sh); });
  reattachCameraVideo();

  $$('[data-exp-sku]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var sku=inp.getAttribute('data-exp-sku');
      var line=$$('.line',sh).find(function(l){ return l.getAttribute('data-sku')===sku; });
      if(!line) return;
      var was=line.getAttribute('data-expected');
      var now=String(Math.max(parseInt(inp.value,10)||0,0));
      if(was===now) return;
      line.setAttribute('data-expected', now);
      appendAuditRaw('edit-expected', currentUser.name+' changed expected qty for '+sku+' from '+was+' to '+now);
      rerenderDetail(sh);
      toast('Expected quantity updated.');
    });
    // don't let the scanner-refocus timer fight a half-typed number
    inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); inp.blur(); } });
  });
  $$('[data-void-scan]').forEach(function(b){ b.addEventListener('click', function(){ voidScan(sh, b.getAttribute('data-void-scan')); }); });
  $$('[data-add-line]').forEach(function(b){ b.addEventListener('click', function(){ addExtraAsLine(sh, b.getAttribute('data-add-line')); }); });

  var eh=$('#btnEditHeader'); if(eh) eh.addEventListener('click', function(){ openEditHeaderModal(sh); });
  var al=$('#btnAddLine'); if(al) al.addEventListener('click', function(){ openAddLineModal(sh); });
  wireBreakdownPanel(sh);
  var sp=$('#btnSavePallets'); if(sp) sp.addEventListener('click', function(){ savePallets(sh); });
  var bc=$('#btnComplete'); if(bc) bc.addEventListener('click', function(){ openCompleteModal(sh); });
}

function flashAlert(kind, msg){
  var el=$('#scanAlert'); if(!el) return;
  var cls = kind==='ok'?'alert-ok':(kind==='warn'?'alert-warn':'alert-bad');
  var ic = kind==='ok'?'✓':(kind==='warn'?'⚠':'✕');
  el.innerHTML = '<div class="alert-flash '+cls+'">'+ic+' '+esc(msg)+'</div>';
  clearTimeout(flashAlert._t);
  flashAlert._t = setTimeout(function(){ if(el) el.innerHTML=''; }, 3200);
}

function performScanMutation(sh, code, user){
  code = normBarcode(code);
  var skuRec = findSkuByBarcode(code);
  var ts=new Date().toISOString();
  var result, sku='';
  if(!skuRec){ result='unknown'; }
  else{
    sku = skuRec.getAttribute('data-sku');
    var line = $$('.line',sh).find(function(l){ return l.getAttribute('data-sku')===sku; });
    if(!line){
      // The slip lists a description without naming the flavour; the box in your hand is
      // one of them. Count it against that line rather than calling it "not on the slip".
      var d=normDesc(skuRec.getAttribute('data-desc'));
      line = $$('.line',sh).find(function(l){ return normDesc(l.getAttribute('data-desc'))===d; });
      if(line) sku=line.getAttribute('data-sku');   // count against the line…
    }
    if(!line){ result='unexpected'; }
    else{
      var exp=parseInt(line.getAttribute('data-expected')||'0',10);
      result = (countScans(sh,sku)+1 > exp) ? 'exceeds' : 'ok';
    }
  }
  var scanlog=$('.scanlog',sh);
  var rec=document.createElement('div'); rec.className='scan';
  rec.setAttribute('data-rid',uid()); rec.setAttribute('data-sku',sku); rec.setAttribute('data-barcode',code);
  // …but remember exactly which product was in the operator's hand, so a slip line that
  // names no flavour still reports the flavours actually received
  if(skuRec) rec.setAttribute('data-prodsku', skuRec.getAttribute('data-sku'));
  rec.setAttribute('data-user',user); rec.setAttribute('data-ts',ts); rec.setAttribute('data-result',result); rec.setAttribute('data-void','false');
  scanlog.appendChild(rec);
  if(sh.getAttribute('data-status')==='Open') sh.setAttribute('data-status','Receiving');
  var descPart = skuRec? (' — '+skuLabel(skuRec)) : '';
  appendAuditRaw('scan', user+' scanned "'+code+'"'+(sku?' ('+sku+descPart+')':'')+' → '+result);
  return {result:result, sku:sku, desc: skuRec? skuLabel(skuRec) : ''};
}

function rerenderDetail(sh){
  var v=$('#viewport'); if(!v) return;
  var freshSh=findShipment(sh.getAttribute('data-rid'));
  if(!freshSh) return;
  v.innerHTML=renderShipmentDetail(freshSh);
  wireShipmentDetail(freshSh);
}

async function submitScan(sh, code, viaCamera){
  var user=currentUser.name;

  // A barcode we've never seen isn't an error — it's a product we haven't learned yet.
  // Hold it and ask which packing-slip item it belongs to, once.
  if(!findSkuByBarcode(code)){
    if(pendingEnroll.indexOf(code)<0){ pendingEnroll.push(code); enrollFilter=''; }
    beep('warn');
    rerenderDetail(sh);
    var inp=document.getElementById('scanInput'); if(inp && !viaCamera && keyboardScanMode) inp.focus();
    return;
  }

  var out;
  try{
    if(viaCamera){
      await withSync(function(){ out=performScanMutation(sh, code, user); });
    } else {
      out=performScanMutation(sh, code, user);
    }
  }catch(e){ return; }
  if(!out) return;
  if(out.result==='ok') beep('ok'); else if(out.result==='unknown') beep('bad'); else beep('warn');
  // render first — the flash lives inside the panel this rebuilds
  rerenderDetail(sh);
  if(out.result==='ok') flashAlert('ok', out.desc || out.sku);
  else if(out.result==='exceeds') flashAlert('warn', 'QUANTITY EXCEEDS EXPECTED — '+(out.desc||out.sku));
  else if(out.result==='unexpected') flashAlert('warn', 'NOT ON PACKING SLIP — '+(out.desc||out.sku));
  else flashAlert('bad', 'UNKNOWN BARCODE — "'+code+'"');
  var input=document.getElementById('scanInput'); if(input && !viaCamera && keyboardScanMode) input.focus();
}

/* link the held barcode to a packing-slip item, then count the box */
function enrollBarcode(sh, code, sku){
  var line=$$('.line',sh).find(function(l){ return l.getAttribute('data-sku')===sku; });
  var desc=line? line.getAttribute('data-desc') : '';
  var rec=ensureMasterSku(desc, sku, [code]);
  appendAuditRaw('enroll-barcode', currentUser.name+' linked barcode "'+code+'" to '+sku+' — '+(rec.getAttribute('data-desc')||''));
  pendingEnroll.shift(); enrollFilter='';
  var out=performScanMutation(sh, code, currentUser.name);
  beep('ok');
  rerenderDetail(sh);
  flashAlert('ok', 'Learned: '+(out.desc||sku));
  var input=document.getElementById('scanInput'); if(input && keyboardScanMode) input.focus();
}
/* A box whose barcode is on neither the slip nor the catalogue used to be a dead end: the
   only options were "not on this packing slip" or skip, and nothing was ever added to the
   master list. Now the operator can create the product then and there. The description is
   stored EXACTLY as typed — the app cannot invent your master-list wording for an item that
   was never in your master list. */
function openNewProductFromScan(sh, code){
  document.body.insertAdjacentHTML('beforeend',''+
  '<div class="modal-back" id="newProdBack"><div class="modal" style="max-width:520px;">'+
    '<div class="modal-head"><h3 style="margin:0;flex:1;">Add this to your Master SKU list</h3><button class="btn-ghost" id="closeNewProd">✕</button></div>'+
    '<div class="modal-body col" style="gap:12px;">'+
      '<div class="small muted">Barcode <span class="mono" style="font-weight:700;color:var(--ink);">'+esc(code)+'</span> — not on this packing slip and not in your product list yet.</div>'+
      '<div class="field"><label>Description <span style="color:var(--bad);">*</span></label>'+
        '<input id="npDesc" list="skuDatalist" placeholder="Type it exactly as it reads on your master list">'+
        '<div class="small muted" style="margin-top:5px;">Saved word for word as you type it. Start typing to reuse the wording of a product you already have.</div></div>'+
      '<div class="grid grid-2" style="gap:12px;">'+
        '<div class="field"><label>Flavour</label><input id="npFlavor" placeholder="e.g. SWEET"></div>'+
        '<div class="field"><label>Size / pack</label><input id="npSize" placeholder="e.g. 15 CT DISPLAY"></div>'+
      '</div>'+
      '<label class="row small chk" style="gap:7px;cursor:pointer;"><input type="checkbox" id="npAddLine" checked style="width:auto;"> Also add it to this packing slip, so the box counts against a line</label>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn" id="cancelNewProd">Cancel</button><button class="btn btn-primary" id="saveNewProd">Add product</button></div>'+
  '</div></div>');
  var close=function(){ closeModal('newProdBack'); };
  $('#closeNewProd').onclick=$('#cancelNewProd').onclick=close;
  setTimeout(function(){ try{ $('#npDesc').focus(); }catch(e){} }, 60);
  $('#saveNewProd').addEventListener('click', function(){
    var desc=$('#npDesc').value.trim();
    if(!desc){ toast('Description is required.','bad'); return; }
    var flavor=$('#npFlavor').value.trim(), size=$('#npSize').value.trim();
    var rec=ensureMasterSku(desc, '', [code], flavor, size);
    var sku=rec.getAttribute('data-sku');
    appendAuditRaw('add-sku', currentUser.name+' added product '+sku+' — '+desc+(flavor?' ('+flavor+')':'')+' from a scan of "'+code+'"');
    if($('#npAddLine').checked && !$$('.line',sh).some(function(l){ return l.getAttribute('data-sku')===sku; })){

  });
}

/* the operator says this box isn't on the slip — record it as a genuine unknown */
function rejectEnroll(sh, code){
  pendingEnroll.shift(); enrollFilter='';
  performScanMutation(sh, code, currentUser.name); // no barcode match -> logged as 'unknown'
  beep('bad');
  rerenderDetail(sh);
  flashAlert('bad', 'Recorded as an unknown barcode: '+code);
  var input=document.getElementById('scanInput'); if(input && keyboardScanMode) input.focus();
}
function skipEnroll(sh){
  pendingEnroll.shift(); enrollFilter='';
  rerenderDetail(sh);
  var input=document.getElementById('scanInput'); if(input && keyboardScanMode) input.focus();
}

/* ================================================================ DELETING RECORDS
   Deletions are permanent and admin-only, always behind a typed/explicit confirmation,
   and always written to the audit trail before the record disappears. */
function confirmDelete(opts){
  // opts: {title, body, warn, confirmWord, onConfirm}
  var needWord = !!opts.confirmWord;
  document.body.insertAdjacentHTML('beforeend',''+
  '<div class="modal-back" id="confirmDelBack"><div class="modal" style="max-width:460px;">'+
    '<div class="modal-head"><h3 style="margin:0;flex:1;">'+esc(opts.title)+'</h3><button class="btn-ghost" id="closeConfirmDel">✕</button></div>'+
    '<div class="modal-body">'+
      '<p style="margin:0 0 12px;">'+opts.body+'</p>'+
      (opts.warn? '<div class="small" style="background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:7px;font-weight:600;margin-bottom:12px;">'+opts.warn+'</div>':'')+
      (needWord? '<div class="field"><label>Type <strong>'+esc(opts.confirmWord)+'</strong> to confirm</label><input id="confirmDelWord" autocomplete="off"></div>':'')+
    '</div>'+
    '<div class="modal-foot"><button class="btn" id="cancelConfirmDel">Cancel</button>'+
      '<button class="btn btn-danger" id="doConfirmDel"'+(needWord?' disabled':'')+'>Delete permanently</button></div>'+
  '</div></div>');
  var close=function(){ closeModal('confirmDelBack'); };
  $('#closeConfirmDel').onclick=close; $('#cancelConfirmDel').onclick=close;
  if(needWord){
    var btn=$('#doConfirmDel'), fld=$('#confirmDelWord');
    // A greyed-out button under a wall of warning text reads as "broken", not as
    // "there is one more step" — so the button itself says what it is waiting for.
    btn.textContent='Type '+opts.confirmWord+' to confirm';
    fld.addEventListener('input', function(){
      var okNow = this.value.trim().toUpperCase()===opts.confirmWord.toUpperCase();
      btn.disabled = !okNow;
      btn.textContent = okNow? 'Delete permanently' : 'Type '+opts.confirmWord+' to confirm';
    });
    setTimeout(function(){ try{ fld.focus(); }catch(e){} }, 60);
  }
  $('#doConfirmDel').addEventListener('click', function(){ close(); opts.onConfirm(); });
}

  var tot=shipmentTotals(sh);
  confirmDelete({
    title:'Delete shipment',
    body:'<strong>'+esc(label)+'</strong> — '+esc(sh.getAttribute('data-client')||'')+'<br>'+
         shipmentLines(sh).length+' line(s), '+tot.scanTot+' scanned box(es).',
    warn:'This permanently removes the shipment and all of its scans. Learned barcodes stay in your product list. This cannot be undone.',
    confirmWord:'DELETE',
    onConfirm:function(){
      appendAuditRaw('delete-shipment', currentUser.name+' deleted shipment '+label+' ('+(sh.getAttribute('data-client')||'')+') with '+shipmentLines(sh).length+' lines and '+tot.scanTot+' scans');
      sh.remove();
      if(view.shipmentId===id){ view.shipmentId=null; saveViewState(); }
      toast('Shipment deleted.');

}

function deleteSku(rid){

  var rec=$('.sku[data-rid="'+cssEsc(rid)+'"]',skuMasterEl); if(!rec) return;
  var sku=rec.getAttribute('data-sku'), desc=rec.getAttribute('data-desc');

  });

    warn: used? 'This product appears on an existing shipment. Deleting it removes its barcode link — those shipments keep their counts, but the item will no longer be recognised when scanned. Consider deactivating it instead.' : 'Its learned barcodes will be forgotten. This cannot be undone.',
    confirmWord:'DELETE',

/* Clearing the catalogue — the whole thing, or just what the search is showing.
   Deleting a product never touches a shipment: lines keep their own SKU, description and
   counts. What is lost is the barcode binding, so those boxes have to be identified once
   more on the next scan. That is worth saying plainly before someone wipes 500 products. */
function deleteAllSkus(){
  if(!isAdmin()){ toast('Only an administrator can delete products.','bad'); return; }
  var scoped = skuSearchActive();
  var list = scoped ? filteredSkus() : allSkus();
  if(!list.length){ toast('There are no products to delete.','bad'); return; }

  var withCodes = list.filter(function(s){ return skuBarcodes(s).length; }).length;
  var usedSkus = Object.create(null);
  allShipments().forEach(function(sh){
    $$('.line',sh).forEach(function(l){ usedSkus[l.getAttribute('data-sku')]=true; });
  });
  var used = list.filter(function(s){ return usedSkus[s.getAttribute('data-sku')]; }).length;

  var warn = 'This cannot be undone.';
  if(withCodes) warn += ' '+withCodes+' of them '+(withCodes===1?'has a learned barcode':'have learned barcodes')+
    ' — those bindings are lost, and each of those boxes has to be identified once more the next time it is scanned.';
  if(used) warn += ' '+used+' appear'+(used===1?'s':'')+' on an existing shipment. Those shipments keep their lines, counts and history; only the product entry goes.';
  warn += ' Export CSV first if you want a copy.';

  confirmDelete({
    title: scoped? 'Delete these products' : 'Delete the whole catalogue',
    body: scoped
      ? 'Delete the <strong>'+list.length+'</strong> product'+(list.length===1?'':'s')+' currently shown by your search?'
      : 'Delete <strong>all '+list.length+'</strong> product'+(list.length===1?'':'s')+' from the Master SKU Database?',
    warn: warn,
    confirmWord: scoped? 'DELETE' : 'DELETE ALL',
    onConfirm:function(){
      appendAuditRaw('delete-skus', currentUser.name+' deleted '+list.length+' product(s) from the master catalogue'+
        (scoped? ' matching the search "'+(window.__skuSearch||'')+'"'+(window.__skuOnlyMissing?' (no barcode)':'') : ' — the entire catalogue'));
      list.forEach(function(rec){ rec.remove(); });
      if(!scoped){ window.__skuSearch=''; window.__skuOnlyMissing=false; }
      toast(list.length+' product'+(list.length===1?'':'s')+' deleted.');
      render();
    }
  });
}

function deleteLine(sh, sku){

/* Delete every scan of an item that was never on the slip — the "scanned it by mistake"
   case. Scans are append-only, so this voids them: the count drops to zero and the record
   of what happened stays in the feed and the audit trail. */
function deleteExtraScans(sh, sku){
  if(!isAdmin()){ toast('Only an administrator can delete scans.','bad'); return; }
  var live=$$('.scan',sh).filter(function(s2){
    return s2.getAttribute('data-void')!=='true' && s2.getAttribute('data-sku')===sku;
  });
  if(!live.length){ toast('Nothing to delete.','bad'); return; }
  var rec=findSkuByCode(sku);
  confirmDelete({
    title:'Delete these scans',
    body:'<strong>'+esc(rec? skuLabel(rec) : sku)+'</strong><br>'+live.length+' scan'+(live.length===1?'':'s')+' will be removed from the count.',
    warn:'The scans stay in the scan feed and the audit trail marked as voided — nothing is hidden, the boxes just stop counting.',
    onConfirm:function(){
      var when=new Date().toISOString();
      live.forEach(function(s2){
        s2.setAttribute('data-void','true');
        s2.setAttribute('data-voidby', currentUser.name);
        s2.setAttribute('data-voidat', when);
      });
      appendAuditRaw('correction', currentUser.name+' deleted '+live.length+' scan(s) of '+(rec? skuLabel(rec) : sku)+' (not on the packing slip)');
      toast(live.length+' scan'+(live.length===1?'':'s')+' deleted.');

/* ================================================================ barcode decoding from camera frames
   Safari (iPhone/iPad) and Firefox have no BarcodeDetector, so relying on it meant camera
   scanning simply did nothing on most phones. This decodes the common 1D case symbologies
   ourselves from the video frame: EAN-13 / UPC-A / EAN-8, Code 128, and ITF-14. */

var EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
var EAN_G=EAN_L.map(function(s){ return s.split('').reverse().map(function(c){return c==='0'?'1':'0';}).join(''); });
var EAN_R=EAN_L.map(function(s){ return s.split('').map(function(c){return c==='0'?'1':'0';}).join(''); });
var EAN_PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
var C128=('212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 '+
'122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 '+
'322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 '+
'132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 '+
'332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 '+
'142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 '+
'212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 '+
'211214 211232 233111').split(/\s+/);
var ITF_PAT=['nnwwn','wnnnw','nwnnw','wwnnn','nnwnw','wnwnn','nwwnn','nnnww','wnnwn','nwnwn'];

/* widths of alternating dark/light runs along one scanline */
function runsFromLine(gray, w){
  var mn=255,mx=0,i;
  for(i=0;i<w;i++){ if(gray[i]<mn)mn=gray[i]; if(gray[i]>mx)mx=gray[i]; }
  if(mx-mn<45) return null;              // no real contrast: blurry or blank
  var thr=(mn+mx)/2;
  var runs=[], cur=gray[0]<thr?1:0, len=1;
  for(i=1;i<w;i++){
    var b=gray[i]<thr?1:0;
    if(b===cur) len++; else { runs.push({dark:cur,len:len}); cur=b; len=1; }
  }
  runs.push({dark:cur,len:len});
  return runs;
}
function modulesOf(runs, from, count, mod){
  var out='';
  for(var i=0;i<count;i++){
    var r=runs[from+i]; if(!r) return null;
    var n=Math.round(r.len/mod);
    if(n<1||n>4) return null;
    out+=(r.dark?'1':'0').repeat(n);
  }
  return out;
}
function eanChecksumOk(d){
  // weights run 3,1,3,1… leftward from the digit before the check digit
  var sum=0, n=d.length;
  for(var i=0;i<n-1;i++){
    var w=(((n-1-i)%2)===1)?3:1;
    sum+=parseInt(d[i],10)*w;
  }
  return ((10-(sum%10))%10)===parseInt(d[n-1],10);
}
function decodeEAN(runs){
  for(var s=0;s<runs.length-30;s++){
    if(!runs[s].dark) continue;
    var g=(runs[s].len+runs[s+1].len+runs[s+2].len)/3;
    if(g<1) continue;
    if(Math.abs(runs[s].len-g)>g*0.6||Math.abs(runs[s+1].len-g)>g*0.6||Math.abs(runs[s+2].len-g)>g*0.6) continue;
    // ---- EAN-13 / UPC-A: 6 digits, middle guard, 6 digits
    var digits='', parity='', p=s+3, ok=true, k, pat, idx;
    for(k=0;k<6;k++){
      pat=modulesOf(runs,p,4,g);
      if(!pat||pat.length!==7){ ok=false; break; }
      idx=EAN_L.indexOf(pat);
      if(idx>=0){ parity+='L'; } else { idx=EAN_G.indexOf(pat); if(idx>=0) parity+='G'; }
      if(idx<0){ ok=false; break; }
      digits+=idx; p+=4;
    }
    if(ok){
      var mid=modulesOf(runs,p,5,g);
      if(mid==='01010'){
        p+=5;
        var right='';
        for(k=0;k<6;k++){
          pat=modulesOf(runs,p,4,g);
          if(!pat){ ok=false; break; }
          idx=EAN_R.indexOf(pat);
          if(idx<0){ ok=false; break; }
          right+=idx; p+=4;
        }
        if(ok){
          var first=EAN_PARITY.indexOf(parity);
          if(first>=0){
            var full=String(first)+digits+right;
            if(eanChecksumOk(full)) return full;
          }
        }
      }
    }
    // ---- EAN-8: 4 digits, middle guard, 4 digits
    digits=''; p=s+3; ok=true;
    for(k=0;k<4;k++){
      pat=modulesOf(runs,p,4,g);
      if(!pat){ ok=false; break; }
      idx=EAN_L.indexOf(pat);
      if(idx<0){ ok=false; break; }
      digits+=idx; p+=4;
    }
    if(ok && modulesOf(runs,p,5,g)==='01010'){
      p+=5; var r8='';
      for(k=0;k<4;k++){
        pat=modulesOf(runs,p,4,g);
        if(!pat){ ok=false; break; }
        idx=EAN_R.indexOf(pat);
        if(idx<0){ ok=false; break; }
        r8+=idx; p+=4;
      }
      if(ok){
        var e8=digits+r8;
        if(e8.length===8 && eanChecksumOk(e8)) return e8;
      }
    }
  }
  return null;
}
function c128Symbol(runs, at, mod){
  var widths='', i;
  for(i=0;i<6;i++){
    var r=runs[at+i]; if(!r) return -1;
    var n=Math.round(r.len/mod);
    if(n<1||n>4) return -1;
    widths+=n;
  }
  return C128.indexOf(widths);
}
function decodeCode128(runs){
  for(var s=0;s<runs.length-14;s++){
    if(!runs[s].dark) continue;
    var total=0, i, bad=false;
    for(i=0;i<6;i++){ if(!runs[s+i]){ bad=true; break; } total+=runs[s+i].len; }
    if(bad||!total) continue;
    var mod=total/11;
    if(mod<0.8) continue;
    var start=c128Symbol(runs,s,mod);
    if(start!==103&&start!==104&&start!==105) continue;

    // read symbols up to the stop character
    var vals=[], p=s+6, guard=0, v=-1, sawStop=false;
    while(guard++<100){
      v=c128Symbol(runs,p,mod);
      if(v<0) break;
      if(v===106){ sawStop=true; break; }
      vals.push(v); p+=6;
    }
    if(!sawStop||vals.length<2) continue;

    // last data symbol is the check character
    var check=vals.pop();
    var sum=start;
    for(i=0;i<vals.length;i++) sum+=vals[i]*(i+1);
    if((sum%103)!==check) continue;

    var mode = start===103?'A':(start===104?'B':'C');
    var out='';
    for(i=0;i<vals.length;i++){
      v=vals[i];
      if(mode==='C'){
        if(v<100) out+=String(v).padStart(2,'0');
        else if(v===100) mode='B';
        else if(v===101) mode='A';
        continue;
      }
      if(mode==='B'){
        if(v<95) out+=String.fromCharCode(32+v);
        else if(v===99) mode='C';
        else if(v===101) mode='A';
        continue;
      }
      if(v<64) out+=String.fromCharCode(32+v);
      else if(v<96) out+=String.fromCharCode(v-64);
      else if(v===99) mode='C';
      else if(v===100) mode='B';
    }
    if(out) return out;
  }
  return null;
}
function decodeITF(runs){
  for(var s=0;s<runs.length-10;s++){
    if(!runs[s].dark) continue;
    var nar=(runs[s].len+runs[s+1].len+runs[s+2].len+runs[s+3].len)/4;
    if(nar<1) continue;
    var isStart=true;
    for(var i=0;i<4;i++){ if(Math.abs(runs[s+i].len-nar)>nar*0.5){ isStart=false; break; } }
    if(!isStart) continue;
    var digits='', p=s+4, guard=0;
    while(guard++<20){
      if(!runs[p]||!runs[p+9]) break;
      var bars='', spaces='', bad=false;
      for(var k=0;k<10;k++){
        var r=runs[p+k]; if(!r){ bad=true; break; }
        var wide = r.len > nar*1.8;
        if(k%2===0) bars+=(wide?'w':'n'); else spaces+=(wide?'w':'n');
      }
      if(bad) break;
      var d1=ITF_PAT.indexOf(bars), d2=ITF_PAT.indexOf(spaces);
      if(d1<0||d2<0) break;
      digits+=d1; digits+=d2; p+=10;
      // Stop is wide bar + narrow space + narrow bar — but a digit pair starting with "wnn"
      // looks identical, so only trust it when the quiet zone (or the image edge) follows.
      if(runs[p] && runs[p].len>nar*1.8 && runs[p+1] && runs[p+1].len<nar*1.8 &&
         runs[p+2] && runs[p+2].len<nar*1.8 &&
         (!runs[p+3] || (!runs[p+3].dark && runs[p+3].len>nar*3))){
        if(digits.length>=6 && digits.length%2===0) return digits;
        break;
      }
    }
  }
  return null;
}
/* sample several scanlines; only accept a value two lines agree on, so a misread
   never silently becomes a counted case */
function decodeFrame(ctx, w, h){
  var votes=Object.create(null), i, x;
  for(i=0;i<13;i++){
    var y=Math.round(h*(0.25+0.5*(i/12)));
    if(y<0||y>=h) continue;
    var data;
    try{ data=ctx.getImageData(0,y,w,1).data; }catch(e){ return null; }
    var gray=new Uint8Array(w);
    for(x=0;x<w;x++) gray[x]=(data[x*4]*0.299+data[x*4+1]*0.587+data[x*4+2]*0.114)|0;
    var runs=runsFromLine(gray,w);
    if(!runs||runs.length<12) continue;
    var rev=runs.slice().reverse();
    var got=decodeEAN(runs)||decodeEAN(rev)||decodeCode128(runs)||decodeCode128(rev)||decodeITF(runs)||decodeITF(rev);
    if(got) votes[got]=(votes[got]||0)+1;
  }
  for(var code in votes){ if(votes[code]>=2) return code; }
  return null;
}

/* ---------------------------------------------------------------- camera scanning */
var cameraCanvas=null;
function startCamera(sh){
  var useNative = ('BarcodeDetector' in window);
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    cameraFail('This browser can\'t open a camera here. Use a USB or Bluetooth scanner, or type the barcode above.');
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}}).then(function(stream){
    cameraStream=stream;
    render();
    reattachCameraVideo();
    var msg=$('#cameraMsg');
    if(msg) msg.textContent='Hold the barcode steady, filling the width of the frame.';
    var detector=null;
    if(useNative){
      try{ detector=new window.BarcodeDetector({formats:['code_128','ean_13','ean_8','upc_a','upc_e','code_39','itf']}); }catch(e){ detector=null; }
    }
    var lastCode='', lastAt=0, busy=false;
    function accept(val){
      var now=Date.now();
      if(!val || (val===lastCode && now-lastAt<1800)) return;
      lastCode=val; lastAt=now;
      var freshSh=findShipment(sh.getAttribute('data-rid'));
      if(freshSh) submitScan(freshSh, val, true);
    }
    function loop(){
      if(!cameraStream) return;
      var video=document.getElementById('cameraVideo');
      if(!video||video.readyState<2||busy){ cameraRAF=requestAnimationFrame(loop); return; }
      if(detector){
        busy=true;
        detector.detect(video).then(function(codes){
          if(codes&&codes.length) accept(codes[0].rawValue);
        }).catch(function(){ detector=null; }).then(function(){ busy=false; });
      } else {
        // own decoder: downscale the frame and read scanlines from it
        if(!cameraCanvas) cameraCanvas=document.createElement('canvas');
        // keep resolution high: the decoder needs roughly 3px per barcode module
        var vw=video.videoWidth||640, vh=video.videoHeight||480;
        var cw=Math.min(vw,1600), ch=Math.round(vh*(cw/vw));
        if(cameraCanvas.width!==cw){ cameraCanvas.width=cw; cameraCanvas.height=ch; }
        var cctx=cameraCanvas.getContext('2d',{willReadFrequently:true});
        cctx.drawImage(video,0,0,cw,ch);
        var val=decodeFrame(cctx,cw,ch);
        if(val) accept(val);
      }
      cameraRAF=requestAnimationFrame(loop);
    }
    loop();
  }).catch(function(err){
    var name=err&&err.name||'';
    if(name==='NotAllowedError'){
      cameraFail('Camera blocked. This app runs inside a secure frame that is not granted camera access, so the browser refuses it before this page sees it — changing your phone settings will not help. Use a USB or Bluetooth scanner (tap "Scanner setup"), or type the barcode above.');
    } else if(name==='NotFoundError'||name==='OverconstrainedError'){
      cameraFail('No camera found on this device.');
    } else if(name==='NotReadableError'){
      cameraFail('The camera is already in use by another app. Close it and try again.');
    } else {
      cameraFail('Could not start the camera: '+(err&&err.message||name||'unknown error'));
    }
  });
}

/* The button says exactly what it will do. Searching re-renders only the results (so
   typing survives), which means this label has to be repainted by hand — a button reading
   "Delete all 500" that actually deletes the 5 rows on screen is how a catalogue dies. */

function filteredSkus(){
  var q=(window.__skuSearch||'').toLowerCase();

    if(onlyMissing && skuBarcodes(s).length) return false;
    if(!q) return true;
    return (s.getAttribute('data-sku')||'').toLowerCase().indexOf(q)>-1 ||
           (s.getAttribute('data-desc')||'').toLowerCase().indexOf(q)>-1 ||
           (s.getAttribute('data-barcodes')||'').toLowerCase().indexOf(q)>-1 ||
           skuFlavor(s).toLowerCase().indexOf(q)>-1 ||
           skuSize(s).toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){ return (a.getAttribute('data-desc')||'').localeCompare(b.getAttribute('data-desc')||''); });
}

async function importSkuCsv(file){
  if(!file) return;
  var progressEl0=$('#skuImportProgress'); if(progressEl0) progressEl0.innerHTML='<div class="small muted">Reading '+esc(file.name)+'…</div>';
  var rows;
  try{ rows=await parseTabularFile(file); }
  catch(e){ toast(e.message||'Could not parse that file.','bad'); if(progressEl0) progressEl0.innerHTML=''; return; }
  var hi=detectHeaderRow(rows);
  var headers=rows[hi]||[];
  var skuCol=findColLoose(headers,['sku','itemcode','itemno','partno','code']);
  var barCol=findColLoose(headers,['barcode','upc','ean','gtin']);
  var descCol=findColLoose(headers,['description','desc','product','item']);
  var actCol=findColLoose(headers,['active','status']);
  var flavCol=findColLoose(headers,['flavor','flavour','variety','strain']);
  var sizeCol=findColLoose(headers,['size','pack','count','display','configuration']);
  if(skuCol<0 && descCol<0){
    toast('That file needs a Description or SKU column.','bad');
    if(progressEl0) progressEl0.innerHTML=''; return;
  }
  var items=[];
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i]; if(!r.length) continue;
    var sku=skuCol>=0? String(r[skuCol]||'').trim() : '';
    var desc=descCol>=0? String(r[descCol]||'').trim() : '';
    if(!sku && !desc) continue;
    var flavor = flavCol>=0? String(r[flavCol]||'').trim() : '';
    var size    = sizeCol>=0? String(r[sizeCol]||'').trim() : '';
    items.push({
      explicitSku: sku,
      desc: desc, flavor: flavor, size: size,
      barcodes: barCol>=0? String(r[barCol]||'').trim().replace(/[;|]/g,',')
        .split(',').map(normBarcode).filter(Boolean).join(',') : '',
      active: actCol>=0? !/^(false|inactive|no|0)$/i.test(String(r[actCol]||'').trim()) : true
    });
  }
  if(!items.length){ toast('No product rows found in that file.','bad'); if(progressEl0) progressEl0.innerHTML=''; return; }
  var progressEl=$('#skuImportProgress');
  /* ONE ROW OF THE MASTER LIST IS ONE PRODUCT. Never fold two rows into one record.
     A master list often repeats the same description across dozens of rows that differ
     only by flavour and barcode; matching on description alone collapsed all of them into
     a single product carrying dozens of barcodes, so every one of those boxes scanned as
     the same item. A barcode belongs to exactly one product — this import enforces that,
     and repairs records that an earlier import had already merged. */
  var claimed=Object.create(null);   // rid -> already taken by an earlier row in THIS file
  var split=0, updated=0, created=0;
  function unclaimedOrNull(rec){
    if(!rec) return null;
    return claimed[rec.getAttribute('data-rid')] ? null : rec;
  }
  await bulkWrite(items, 40, function(it){
    var codes=it.barcodes? it.barcodes.split(',').filter(Boolean) : [];
    var existing = null;
    // a barcode is the strongest identity the file gives us
    for(var i=0;i<codes.length && !existing;i++) existing=unclaimedOrNull(findSkuByBarcode(codes[i]));
    if(!existing && it.explicitSku) existing=unclaimedOrNull(findSkuByCode(it.explicitSku));
    if(!existing && !codes.length && it.desc) existing=unclaimedOrNull(findSkuByDesc(it.desc, it.flavor, it.size));

    if(existing){
      if(it.desc) existing.setAttribute('data-desc', it.desc);
      if(it.flavor) existing.setAttribute('data-flavor', it.flavor);
      if(it.size) existing.setAttribute('data-size', it.size);
      existing.setAttribute('data-active', it.active?'true':'false');
      updated++;
    } else {
      existing=document.createElement('div'); existing.className='sku';
      existing.setAttribute('data-rid',uid());
      existing.setAttribute('data-sku', uniqueSkuCode(it.explicitSku, it.desc, it.flavor, it.size, codes[0]));
      existing.setAttribute('data-desc', it.desc);
      if(it.flavor) existing.setAttribute('data-flavor', it.flavor);
      if(it.size) existing.setAttribute('data-size', it.size);
      existing.setAttribute('data-active', it.active?'true':'false');
      skuMasterEl.appendChild(existing);
      created++;
    }
    claimed[existing.getAttribute('data-rid')]=true;

    // this row's barcodes now belong to this record and to nothing else
    if(codes.length){
      allSkus().forEach(function(other){
        if(other===existing) return;
        var keep=skuBarcodes(other).filter(function(b){ return codes.indexOf(b)<0; });
        if(keep.length!==skuBarcodes(other).length){
          other.setAttribute('data-barcodes', keep.join(','));
          split++;
        }
      });
      var have=skuBarcodes(existing);
      codes.forEach(function(b){ if(have.indexOf(b)<0) have.push(b); });
      existing.setAttribute('data-barcodes', have.join(','));
    }
  }, function(done,total){ if(progressEl) progressEl.innerHTML='<div class="small muted">Importing… '+done+' / '+total+'</div>'; });
  var note = created+' added, '+updated+' updated'+(split? ', '+split+' barcode(s) moved off a merged product':'');
  appendAuditRaw('import-skus', currentUser.name+' imported '+items.length+' product row(s) — '+note);
  toast('Imported '+items.length+' product row(s): '+note+'.');
  render();
}

/* The category and pallet breakdown for one shipment. Groups are derived on the fly from
   the price list, so loading a corrected list re-groups every shipment without editing
   any of them. Only the operator's boxes-per-pallet overrides are stored. */
function palletOverrides(sh){
  try{ return JSON.parse(sh.getAttribute('data-perplt')||'{}'); }catch(e){ return {}; }
}
function shipmentBreakdown(sh){
  var rows=shipmentLines(sh).map(function(l){
    return {sku:l.getAttribute('data-sku'), desc:l.getAttribute('data-desc')||'',
            cases:parseInt(l.getAttribute('data-expected')||'0',10),
            units:parseQtyCell(l.getAttribute('data-units')),
            net:parseQtyCell(l.getAttribute('data-net')), gross:parseQtyCell(l.getAttribute('data-gross'))};
  });
  var groups=groupSlipLines(rows);
  var ov=palletOverrides(sh);
  groups.forEach(function(g){
    var fromList = g.rec? parseQtyCell(g.rec.getAttribute('data-perplt')) : 0;
    g.listPerPallet = fromList;
    g.perPallet = (ov[g.key]!=null && ov[g.key]!=='') ? parseQtyCell(ov[g.key]) : fromList;
    var sp=palletSplit(g.cases, g.perPallet);
    g.pallets=sp.pallets; g.full=sp.full; g.extra=sp.extra;
    g.overridden = ov[g.key]!=null && ov[g.key]!=='' && parseQtyCell(ov[g.key])!==fromList;
  });
  return groups;
}
function renderBreakdownPanel(sh){
  if(!allPriceCats().length) return '';
  var groups=shipmentBreakdown(sh);
  if(!groups.length) return '';
  var editable = sh.getAttribute('data-status')!=='Completed' && isAdmin();
  var palTot=0, caseTot=0, unmatched=0;
  var rows=groups.map(function(g){
    caseTot+=g.cases; palTot+=g.pallets||0;
    if(!g.matched) unmatched++;
    return '<tr'+(g.matched?'':' style="background:var(--warn-bg);"')+'>'+
      '<td><div>'+esc(g.label)+'</div>'+
        '<div class="small muted" style="margin-top:2px;">'+g.lines.length+' flavour'+(g.lines.length===1?'':'s')+
        (g.matched? '' : ' · <strong style="color:var(--warn);">not on the price list</strong>')+
        (g.overridden? ' · <span style="color:var(--accent);">#/PLT changed from '+esc(String(g.listPerPallet))+'</span>' : '')+
        '</div></td>'+
      '<td class="tab-num" style="font-weight:700;">'+g.cases+'</td>'+
      '<td>'+(editable
        ? '<input class="tab-num qty-edit" data-plt-key="'+esc(g.key)+'" type="number" min="0" step="1" value="'+esc(String(g.perPallet||''))+'" placeholder="'+esc(String(g.listPerPallet||''))+'">'
        : '<span class="tab-num">'+esc(String(g.perPallet||'—'))+'</span>')+'</td>'+
      '<td class="tab-num">'+(g.perPallet? g.pallets.toFixed(2) : '—')+'</td>'+
      '<td class="tab-num">'+(g.perPallet? g.full : '—')+'</td>'+
      '<td class="tab-num">'+(g.perPallet? g.extra : '—')+'</td>'+
    '</tr>';
  }).join('');

  return '<div class="d-breakdown card" style="margin-bottom:18px;">'+
    '<div class="pad" style="padding-bottom:0;">'+
      '<div class="row wrap"><h3 style="margin:0 0 2px;">Category &amp; pallet breakdown</h3><div class="spacer"></div>'+
        '<button class="btn btn-sm" id="btnExportBreakdown">⇩ Export breakdown</button></div>'+
      '<p class="section-sub" style="margin-bottom:12px;">'+groups.length+' categories from '+
        shipmentLines(sh).length+' slip lines · '+caseTot+' cases · '+palTot.toFixed(2)+' pallets. '+
        'Boxes per pallet comes from the price list and can be changed here.</p>'+

/* The breakdown in the customer's own tab-2 column order. */
async function exportBreakdown(sh){
  var groups=shipmentBreakdown(sh);
  var rows=invoiceHeaderRows(sh);
  rows.push(['','Quantity of Master Cases','Description','Units Quantity','Number of pallets','Extra']);
  var palTot=0, caseTot=0;
  groups.forEach(function(g){
    caseTot+=g.cases; palTot+=g.pallets||0;
    g.lines.forEach(function(l, i){
      rows.push([ i===0? g.cases : '', l.cases, l.desc,
                  i===0? (g.perPallet||'') : '',
                  i===0? (g.perPallet? g.pallets : '') : '',
                  i===0? (g.perPallet? g.extra : '') : '' ]);
    });
  });
  rows.push([]);
  rows.push([caseTot, caseTot, '', '', palTot, '']);
  await downloadCSV('breakdown-'+(sh.getAttribute('data-container')||sh.getAttribute('data-rid'))+'.csv', rows);
}

function filteredShipments(){

  return allShipments().filter(function(s){
    if(f.client && (s.getAttribute('data-client')||'').toLowerCase().indexOf(f.client.toLowerCase())<0) return false;
    if(f.container && (s.getAttribute('data-container')||'').toLowerCase().indexOf(f.container.toLowerCase())<0) return false;
    if(f.po && (s.getAttribute('data-po')||'').toLowerCase().indexOf(f.po.toLowerCase())<0) return false;
    if(f.status && s.getAttribute('data-status')!==f.status) return false;
    if(f.from && (s.getAttribute('data-date')||'') < f.from) return false;
    if(f.to && (s.getAttribute('data-date')||'') > f.to) return false;
    if(f.sku && !shipmentLines(s).some(function(l){ return (l.getAttribute('data-sku')||'').toLowerCase().indexOf(f.sku.toLowerCase())>-1; })) return false;

    '</tr>';
  }).join('');
  return '<div class="small muted" style="margin-bottom:8px;">'+ships.length+' shipment'+(ships.length===1?'':'s')+' match'+(ships.length===1?'es':'')+' these filters.</div>'+
    '<div class="card"><div class="table-wrap"><table><thead><tr><th>Client</th><th>Container #</th><th>PO / Slip #</th><th>Date</th><th>Status</th><th>Scanned</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="empty">No shipments match those filters.</td></tr>')+
    '</tbody></table></div></div>';
}

/* The customer's invoice header, reproduced in the exact cells of their own template:
   column B carries the letterhead and the Ship To / Bill To labels, column C the addresses,
   column D the right-hand labels, column E their values. Column A is left empty, as in the
   original. Anything blank stays blank rather than shifting the rows.               */
function settingVal(k, dflt){
  var v=settingsEl && settingsEl.getAttribute(k);
  return (v==null||v==='') ? (dflt||'') : v;
}
/* The letterhead is OUR company — the one issuing the paperwork — and Ship To / Bill To is
   the client we are receiving for. Getting these the wrong way round put the client's name
   where the letterhead belongs. */
function invoiceHeaderFields(sh){
  var cl=findClientByName(sh.getAttribute('data-client')||'');
  var shipTo=(cl&&cl.getAttribute('data-shipto')||'').split(/\r?\n/).filter(function(x){return x.trim();});
  var billTo=(cl&&cl.getAttribute('data-billto')||'').split(/\r?\n/).filter(function(x){return x.trim();});
  if(!billTo.length) billTo=shipTo;               // most slips bill where they ship
  var company=settingVal('data-company');
  return {
    company: company || (sh.getAttribute('data-client')||'').toUpperCase(),
    companySub: settingVal('data-companysub'),
    companyAddr: settingVal('data-companyaddr').split(/\r?\n/).filter(function(x){return x.trim();}),
    client:(sh.getAttribute('data-client')||''),
    shipTo:shipTo, billTo:billTo,
    no: sh.getAttribute('data-invno')||sh.getAttribute('data-po')||'',
    container: sh.getAttribute('data-container')||'',
    date: sh.getAttribute('data-date')||'',
    custId: (cl&&cl.getAttribute('data-custid'))||'',
    permit: (cl&&cl.getAttribute('data-permit'))||settingVal('data-companypermit'),
    po: sh.getAttribute('data-po')||''
  };
}
function invoiceHeaderRows(sh){
  var f=invoiceHeaderFields(sh);
  var R=[];
  function put(row, col, val){                     // col: 0=A, 1=B, 2=C, 3=D, 4=E
    while(R.length<=row) R.push([]);
    var r=R[row]; while(r.length<=col) r.push('');
    r[col]=val;
  }
  put(1,1,f.company); put(1,4,'Invoice');
  if(f.companySub) put(2,1,f.companySub);
  f.companyAddr.forEach(function(l,i){ put(2+i+(f.companySub?1:0), 1, l); });
  var ship=f.shipTo.length? f.shipTo : [f.client];
  var bill=f.billTo.length? f.billTo : [f.client];
  put(3,1,'Ship To:');   put(3,3,'No:');          put(3,4,f.no);
  put(4,2,ship[0]||'');
  put(5,2,ship[1]||''); put(5,3,'CONTAINER:'); put(5,4,f.container);
  put(6,1,'Bill To:');   put(6,2,ship[2]||'');
  put(7,2,bill[0]||''); put(7,3,'Date:');      put(7,4,f.date);
  put(8,2,bill[1]||'');
  put(9,2,bill[2]||''); put(9,3,'Customer ID:'); put(9,4,f.custId);
  put(10,3,'PERMIT #:'); put(10,4,f.permit);
  if(f.po){ put(11,3,'P.O. NUMBER'); put(11,4,f.po); }
  R.push([]);
  return R;
}

/* One set of rows, two renderings: a CSV you can edit in Excel, and a formatted sheet that
   opens in Excel already looking like the printed invoice. */
function buildShipmentRows(sh){
  var tot=shipmentTotals(sh);
  var rows=[], hdrIndex=-1;
  function J(attr){ try{ return JSON.parse(sh.getAttribute(attr)||'null'); }catch(e){ return null; } }
  var srcHeaders=J('data-srcheaders');
  // Shipments imported before the unit/weight columns were excluded still carry them in
  // their stored rows. Drop them here too, so an old shipment exports the same as a new one.
  var srcLines=shipmentLines(sh);
  var srcRaws=srcLines.map(function(l){
    try{ return JSON.parse(l.getAttribute('data-raw')||'null')||[]; }catch(e){ return []; }
  });
  var dropIdx=[];
  if(srcHeaders){
    var srcWidth=srcHeaders.length;
    srcRaws.forEach(function(r){ if(r.length>srcWidth) srcWidth=r.length; });
    for(var di=0; di<srcWidth; di++){
      if(isIgnoredColumn([srcHeaders], di, 0)){ dropIdx.push(di); continue; }
      // spreadsheets carry runs of empty columns past the last real one — a column that
      // is blank in the heading and blank on every line is padding, not part of the slip
      var blank = !String(srcHeaders[di]==null?'':srcHeaders[di]).trim() &&
        srcRaws.every(function(r){ return !String(r[di]==null?'':r[di]).trim(); });
      if(blank) dropIdx.push(di);
    }
  }
  function trimRow(arr){
    if(!dropIdx.length || !arr) return arr;
    return arr.filter(function(_,i){ return dropIdx.indexOf(i)<0; });
  }
  srcHeaders=trimRow(srcHeaders);

  // ---------- the invoice letterhead, cell for cell ----------
  invoiceHeaderRows(sh).forEach(function(r){ rows.push(r); });

  // ---------- column headings: the slip's own, then the receiving columns ----------
  var RECV=['Flavour','Size','Scanned','Difference','Result','Barcode(s)'];
  var DEFAULT_HEADERS=['Quantity of Master Cases','Description',
                       'Number of pallets','Extra','No. of pallets','QTY'];
  var lines=shipmentLines(sh);
  var width = srcHeaders ? srcHeaders.length : DEFAULT_HEADERS.length;
  lines.forEach(function(l){
    try{ var raw=trimRow(JSON.parse(l.getAttribute('data-raw')||'null')); if(raw && raw.length>width) width=raw.length; }catch(e){}
  });
  var hdr = (srcHeaders && srcHeaders.some(function(h){return String(h||'').trim();}))
    ? srcHeaders.slice() : DEFAULT_HEADERS.slice();
  while(hdr.length<width) hdr.push('');
  hdrIndex=rows.length;
  rows.push(hdr.concat(RECV));

  // ---------- one row per packing-slip line ----------
  lines.forEach(function(l){
    var sku=l.getAttribute('data-sku');
    var exp=parseInt(l.getAttribute('data-expected')||'0',10);
    var got=countScans(sh,sku);
    var mrec=findSkuByCode(sku);
    var codes=mrec?skuBarcodes(mrec).join(' '):'';
    var result = got===exp?'MATCH':(got<exp?'SHORT':'OVER');
    var flav=skuFlavor(mrec), size=skuSize(mrec);
    // when the slip line names no flavour, report the flavours that were actually scanned
    var scanned=$$('.scan',sh).filter(function(s2){
      return s2.getAttribute('data-void')!=='true' && s2.getAttribute('data-sku')===sku;
    });
    var seen=[], seenCodes=[];
    scanned.forEach(function(s2){
      var pr=findSkuByCode(s2.getAttribute('data-prodsku')||'');
      var f=skuFlavor(pr); if(f && seen.indexOf(f)<0) seen.push(f);
      if(pr && !size) size=skuSize(pr);
      var c=s2.getAttribute('data-barcode')||''; if(c && seenCodes.indexOf(c)<0) seenCodes.push(c);
    });
    if(seen.length) flav=seen.join(' / ');
    if(seenCodes.length) codes=seenCodes.join(' ');
    var raw=null;
    try{ raw=trimRow(JSON.parse(l.getAttribute('data-raw')||'null')); }catch(e){}
    var base;
    if(raw && raw.length){
      base=raw.slice();
    } else {
      base=[exp, l.getAttribute('data-desc')||''];
    }
    while(base.length<width) base.push('');
    rows.push(base.concat([flav, size, got, got-exp, result, codes]));
  });

  // ---------- anything scanned that was not on the slip ----------
  var extraKeys=Object.keys(tot.extras);
  if(extraKeys.length){
    rows.push([]);
    rows.push(['ITEMS SCANNED BUT NOT ON THIS PACKING SLIP']);
    rows.push(['Description','Flavour','Size','Item Code','Scanned','Barcode(s)']);
    extraKeys.forEach(function(sku){
      var m=findSkuByCode(sku);
      rows.push([m?m.getAttribute('data-desc'):'(unknown item)', skuFlavor(m), skuSize(m),
                 sku, tot.extras[sku], m?skuBarcodes(m).join(' '):'']);
    });
  }

  // ---------- receiving summary ----------
  rows.push([]);
  rows.push(['TOTAL EXPECTED', tot.expTot]);
  rows.push(['TOTAL SCANNED', tot.scanTot]);
  rows.push(['DIFFERENCE', tot.scanTot-tot.expTot]);
  rows.push(['OVERALL', tot.discrepancy?'DISCREPANCY':'MATCH']);
  rows.push(['TOTAL PALLETS', sh.getAttribute('data-pallets')||'0']);
  if(sh.getAttribute('data-palletnotes')) rows.push(['PALLET NUMBERS / NOTES', sh.getAttribute('data-palletnotes')]);
  rows.push(['STATUS', sh.getAttribute('data-status')||'']);
  rows.push(['RECEIVED BY', sh.getAttribute('data-completedby')||sh.getAttribute('data-createdby')||'']);
  rows.push(['COMPLETED AT', sh.getAttribute('data-completedat')||'']);
  if(sh.getAttribute('data-supplier')) rows.push(['SUPPLIER', sh.getAttribute('data-supplier')]);
  if(sh.getAttribute('data-notes')) rows.push(['NOTES', sh.getAttribute('data-notes')]);

  var base='invoice-'+(sh.getAttribute('data-invno')||sh.getAttribute('data-po')||sh.getAttribute('data-container')||sh.getAttribute('data-rid'));
  return {rows:rows, hdrIndex:hdrIndex, name:base, fields:invoiceHeaderFields(sh)};
}

async function exportShipmentReport(sh){
  var built=buildShipmentRows(sh);
  await downloadCSV(built.name+'.csv', built.rows);
}
